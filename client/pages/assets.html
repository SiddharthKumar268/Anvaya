<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Track and manage transfer of discovered assets from deceased to nominee.">
  <title>Asset Transfer - Anvaya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/assets.css">
</head>
<body>
  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <header id="top-header" class="top-header"></header>
    <main class="main-content">
      <div class="page-container">
        
        <!-- Summary Stats -->
        <div class="stats-row fade-in delay-1">
          <div class="stat-card">
            <div class="stat-icon">INR</div>
            <div class="stat-content">
              <span class="stat-label">Total Assets Discovered</span>
              <h3 class="stat-value" id="total-assets-count">8</h3>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon success"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"></polyline></svg></div>
            <div class="stat-content">
              <span class="stat-label">Transferred Successfully</span>
              <h3 class="stat-value" id="transferred-count">1</h3>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon primary"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg></div>
            <div class="stat-content">
              <span class="stat-label">In Progress</span>
              <h3 class="stat-value" id="in-progress-count">2</h3>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon warning">⏳</div>
            <div class="stat-content">
              <span class="stat-label">Pending Transfer</span>
              <h3 class="stat-value" id="pending-count">5</h3>
            </div>
          </div>
        </div>

        <!-- Controls Bar -->
        <div class="controls-bar fade-in delay-2">
          <div class="filter-pills" id="asset-filters">
            <button class="filter-pill active" data-filter="All">All</button>
            <button class="filter-pill" data-filter="Bank Accounts">Bank Accounts</button>
            <button class="filter-pill" data-filter="Property">Property</button>
            <button class="filter-pill" data-filter="Stocks/MF">Stocks/MF</button>
            <button class="filter-pill" data-filter="Fixed Deposits">Fixed Deposits</button>
            <button class="filter-pill" data-filter="Gold">Gold</button>
            <button class="filter-pill" data-filter="Vehicles">Vehicles</button>
            <button class="filter-pill" data-filter="Others">Others</button>
          </div>
          <div class="sort-control">
            <label for="sort-select">Sort by:</label>
            <select id="sort-select" class="form-input">
              <option value="value-desc">Value (High to Low)</option>
              <option value="value-asc">Value (Low to High)</option>
              <option value="status">Status</option>
              <option value="type">Type</option>
            </select>
          </div>
        </div>

        <!-- Asset Cards Grid -->
        <div class="assets-grid fade-in delay-3" id="assets-grid">
          <!-- Rendered by JS -->
        </div>
        
        <!-- Total Value & Add Button -->
        <div class="bottom-actions fade-in delay-4">
          <div class="total-value-card">
            <span class="total-label">Total Portfolio Value</span>
            <h2 class="total-amount" id="total-portfolio-value">₹0</h2>
          </div>
          <button class="btn btn-primary btn-add" id="btn-add-asset">
            <span>+</span> Add New Asset
          </button>
        </div>

      </div>
    </main>
  </div>
  <script src="../js/shared.js"></script>
  <script src="../js/api/anvayaApi.js"></script>
  <script src="../js/ui/assets.js"></script>
</body>
</html>
