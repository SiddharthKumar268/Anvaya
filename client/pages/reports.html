<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Exportable summary of the entire financial recovery journey.">
  <title>Reports & Progress - Anvaya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/reports.css">
</head>
<body>
  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <header id="top-header" class="top-header"></header>
    <main class="main-content">
      <div class="page-container">
        
        <div class="dashboard-grid">
          <!-- Overall Progress Card -->
          <div class="card glass-card overall-progress-card fade-in delay-1">
            <h3 class="card-title">Overall Recovery Progress</h3>
            <div class="progress-chart-container">
              <svg class="progress-ring" width="160" height="160">
                <circle class="progress-ring__circle-bg" stroke="var(--border-color)" stroke-width="12" fill="transparent" r="70" cx="80" cy="80"/>
                <circle class="progress-ring__circle" stroke="var(--blue)" stroke-width="12" fill="transparent" r="70" cx="80" cy="80"/>
              </svg>
              <div class="progress-text">
                <span id="overall-percentage" class="percentage">0%</span>
                <span class="label">Complete</span>
              </div>
            </div>
            <div class="legend-grid" id="progress-legend">
              <!-- Rendered via JS -->
            </div>
          </div>

          <!-- Financial Summary Card -->
          <div class="card glass-card financial-summary-card fade-in delay-2">
            <h3 class="card-title">Financial Summary</h3>
            <div class="financial-grid">
              <div class="fin-column">
                <div class="fin-item">
                  <span class="fin-label">Estimated Total</span>
                  <span class="fin-value" id="est-total">₹0</span>
                </div>
                <div class="fin-item">
                  <span class="fin-label">Amount Received</span>
                  <span class="fin-value text-green" id="amt-received">₹0</span>
                </div>
                <div class="fin-item">
                  <span class="fin-label">Amount Pending</span>
                  <span class="fin-value text-gold" id="amt-pending">₹0</span>
                </div>
              </div>
              <div class="fin-column chart-column">
                <div class="horizontal-bar-chart">
                  <div class="bar-bg">
                    <div class="bar-fill bg-green" id="received-bar" style="width: 0%"></div>
                    <div class="bar-fill bg-gold" id="pending-bar" style="width: 0%"></div>
                  </div>
                  <div class="chart-labels">
                    <span class="text-green text-sm">Received</span>
                    <span class="text-gold text-sm">Pending</span>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Module Progress Grid -->
        <h3 class="section-title fade-in delay-2">Module Progress</h3>
        <div class="module-grid fade-in delay-3" id="module-grid">
          <!-- Rendered via JS -->
        </div>

        <!-- Timeline / Milestones -->
        <div class="timeline-section fade-in delay-4">
          <h3 class="section-title">Timeline & Milestones</h3>
          <div class="card glass-card">
            <div class="timeline" id="milestone-timeline">
              <!-- Rendered via JS -->
            </div>
          </div>
        </div>

        <div class="bottom-grid fade-in delay-5">
          <!-- Case Information -->
          <div class="card glass-card case-info-card">
            <h3 class="card-title">Case Information</h3>
            <div class="info-grid">
              <div class="info-item">
                <span class="info-label">Case ID</span>
                <span class="info-value">ANV-2026-0847</span>
              </div>
              <div class="info-item">
                <span class="info-label">Created</span>
                <span class="info-value">15 Aug 2026</span>
              </div>
              <div class="info-item">
                <span class="info-label">Status</span>
                <span class="info-value"><span class="badge badge-progress">Active</span></span>
              </div>
              <div class="info-item">
                <span class="info-label">Last Updated</span>
                <span class="info-value">Today</span>
              </div>
            </div>
          </div>
          
          <!-- Export Actions -->
          <div class="card glass-card export-card">
            <h3 class="card-title">Export Actions</h3>
            <div class="action-buttons">
              <button class="btn btn-primary" id="btn-export-pdf">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="12" y1="18" x2="12" y2="12"></line><line x1="9" y1="15" x2="15" y2="15"></line></svg>
                Export Full Report as PDF
              </button>
              <button class="btn btn-secondary" id="btn-share">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
                Share with Advisor
              </button>
              <button class="btn btn-ghost" id="btn-print">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 6 2 18 2 18 9"></polyline><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"></path><rect x="6" y="14" width="12" height="8"></rect></svg>
                Print Summary
              </button>
            </div>
          </div>
        </div>

      </div>
    </main>
  </div>
  <script src="../js/shared.js"></script>
  <script src="../js/ui/reports.js"></script>
</body>
</html>
