<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Anvaya Help & Knowledge Hub - Guides, FAQs, and support for nominee families">
  <title>Help & Knowledge Hub - Anvaya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/help.css">
</head>
<body>
  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <header id="top-header" class="top-header"></header>
    
    <main class="main-content">
      <div class="page-header fade-in delay-1">
        <div>
          <h1 class="page-title">Help & Knowledge Hub</h1>
          <p class="page-subtitle">Everything you need to know, in one place</p>
        </div>
      </div>

      <section class="search-section fade-in delay-2">
        <div class="search-container">
          <svg class="search-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="help-search" class="form-input search-input" placeholder="Search for guides, FAQs, or topics..." aria-label="Search help topics">
        </div>
      </section>

      <section class="help-categories-section fade-in delay-2">
        <h2 class="section-title">Quick Help Categories</h2>
        <div class="categories-grid" id="categories-grid">
          <!-- Categories populated by JS -->
        </div>
      </section>

      <div class="content-grid fade-in delay-3">
        <section class="popular-guides-section">
          <h2 class="section-title">Popular Guides</h2>
          <div class="guides-list" id="guides-list">
            <!-- Guides populated by JS -->
          </div>
        </section>

        <aside class="sidebar-info">
          <section class="helplines-card">
            <h2 class="section-title">Emergency Helplines</h2>
            <div class="helplines-list" id="helplines-list">
              <!-- Helplines populated by JS -->
            </div>
          </section>
          
          <section class="support-card">
            <h3>Still need help?</h3>
            <p>Our team is here for you.</p>
            <p class="working-hours">Mon-Sat, 9 AM - 7 PM</p>
            <button class="btn btn-primary" onclick="alert('Support chat opening...')">Contact Support</button>
          </section>
        </aside>
      </div>

      <section class="faq-section fade-in delay-4">
        <h2 class="section-title">Frequently Asked Questions</h2>
        <div class="faq-accordion" id="faq-accordion">
          <!-- FAQs populated by JS -->
        </div>
      </section>
      
    </main>
  </div>
  
  <div id="toast-container" class="toast-container"></div>
  
  <script src="../js/shared.js"></script>
  <script src="../js/ui/help.js"></script>
</body>
</html>
