<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Anvaya Document Checklist - Track required documents for your financial recovery claims.">
  <title>Document Checklist - Anvaya</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/documents.css">
</head>
<body>
  <div class="app-layout">
    <aside id="sidebar" class="sidebar"></aside>
    <header id="top-header" class="top-header"></header>
    
    <main class="main-content">
      <div class="doc-page-header">
        <div class="page-title-group">
          <h1>
            <span class="page-icon"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg></span>
            Document Checklist
          </h1>
          <p class="subtitle">Track and manage all required documents for your claims</p>
        </div>
        <div class="header-actions">
          <div class="doc-progress-summary" id="progress-summary">
            <span class="doc-progress-text"><span id="collected-count-header">0</span> of <span id="total-count-header">0</span> Collected</span>
            <div class="doc-progress-bar">
              <div class="fill" id="progress-fill" style="width: 0%"></div>
            </div>
          </div>
          <button class="btn btn-primary" onclick="generateChecklist()">Generate Checklist</button>
        </div>
      </div>

      <div class="filter-bar">
        <div class="filter-search">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="search-input" placeholder="Search documents...">
        </div>
        <div class="filter-pills" id="category-filters">
          <button class="filter-pill active" data-filter="all">All</button>
          <button class="filter-pill" data-filter="common">Common</button>
          <button class="filter-pill" data-filter="bank">Bank</button>
          <button class="filter-pill" data-filter="lic">Insurance</button>
          <button class="filter-pill" data-filter="property">Property</button>
          <button class="filter-pill" data-filter="other">Other</button>
        </div>
        <div class="filter-pills status-filter" id="status-filters">
          <button class="filter-pill active" data-status="all">All Status</button>
          <button class="filter-pill" data-status="collected">Collected (Done)</button>
          <button class="filter-pill" data-status="pending">Pending ○</button>
        </div>
      </div>

      <div id="documents-container" class="documents-container">
        <!-- Rendered via JS -->
      </div>

      <div class="doc-summary">
        <div class="summary-stats">
          <div class="summary-stat">
            <span class="count" id="total-docs-footer">0</span>
            <span>Total Documents</span>
          </div>
          <div class="summary-stat">
            <span class="count" id="collected-docs-footer" style="color: var(--green, #10B981)">0</span>
            <span>Collected (Done)</span>
          </div>
          <div class="summary-stat">
            <span class="count" id="pending-docs-footer" style="color: #F5A623">0</span>
            <span>Pending ○</span>
          </div>
        </div>
        <button class="btn btn-secondary">Download Checklist</button>
      </div>
    </main>
  </div>
  
  <script src="../js/shared.js"></script>
  <script src="../js/api/caseApi.js"></script>
  <script src="../js/ui/documents.js"></script>
</body>
</html>
